name: CI/CD
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: lexiflow-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kple1/lexiflow/wordapp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Server/WordApp/WordApp.csproj -c Release
      - run: dotnet run --project Tests/SecurityChecks -c Release
      - run: dotnet run --project Tests/ClientSecurityChecks -c Release
      - run: dotnet run --project Tests/LearningChecks -c Release
      - run: python3 -m unittest discover -s Tests/DeploymentChecks -p 'test_*.py'

  push-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 배포는 DEPLOY_ENABLED 저장소 변수가 'true'이고 VM 시크릿이 현재 서버를
  # 가리킬 때만 실행한다.
  deploy:
    needs: push-image
    # Explicitly opt in only after the TLS cutover, backup and schema migration are verified.
    if: vars.DEPLOY_ENABLED == 'true' && vars.SECURITY_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync HTTPS deployment configuration to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "Server/docker-compose.yml,Server/Caddyfile,Server/deploy-image.py"
          target: "~/LexiFlow/Server/incoming"
          strip_components: 1

      # Preserve protected host secrets. Deploy only the immutable commit image;
      # back up first, leave DB/schema unchanged, then verify HTTPS and authentication.
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ghcr.io/kple1/lexiflow/wordapp:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            umask 077
            cd ~/LexiFlow/Server
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            python3 incoming/deploy-image.py
      - name: Verify public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 3 https://lexiflow.duckdns.org/health
