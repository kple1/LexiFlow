name: CI/CD
on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kple1/lexiflow/wordapp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Server/WordApp/WordApp.csproj -c Release

  push-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          push: true
          tags: ${{ env.IMAGE }}:latest

  # 배포는 DEPLOY_ENABLED 저장소 변수가 'true'이고 VM 시크릿이 현재 서버를
  # 가리킬 때만 실행한다.
  deploy:
    needs: push-image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "Server/docker-compose.yml"
          target: "~/LexiFlow/Server"
          strip_components: 1

      # docker-compose.yml only references ${VAR} placeholders (no secrets committed).
      # This step (re)writes the real values into .env, which docker compose loads
      # automatically from the same directory — the file itself never touches git.
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORDS_DATA_SOURCE_ID: ${{ secrets.NOTION_WORDS_DATA_SOURCE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_PASSWORD,NOTION_TOKEN,NOTION_WORDS_DATA_SOURCE_ID,ADMIN_TOKEN,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cat > ~/LexiFlow/Server/.env <<EOF
            DB_PASSWORD=$DB_PASSWORD
            NOTION_TOKEN=$NOTION_TOKEN
            NOTION_WORDS_DATA_SOURCE_ID=$NOTION_WORDS_DATA_SOURCE_ID
            ADMIN_TOKEN=$ADMIN_TOKEN
            EOF
            cd ~/LexiFlow/Server
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull
            docker compose up -d --force-recreate
